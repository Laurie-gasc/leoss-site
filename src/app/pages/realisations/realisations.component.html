<section class="page-banner">
  <h1>Nos réalisations</h1>
  <p>Découvrez nos installations récentes</p>
</section>

<section class="filtres">
  <button [class.active]="filtreActif === 'tous'" (click)="setFiltre('tous')">Tous</button>
  <button [class.active]="filtreActif === 'particuliers'" (click)="setFiltre('particuliers')">Particuliers</button>
  <button [class.active]="filtreActif === 'professionnels'" (click)="setFiltre('professionnels')">Professionnels</button>
  <button [class.active]="filtreActif === 'collectivites'" (click)="setFiltre('collectivites')">Collectivités</button>
</section>

<section class="galerie">
  <div class="galerie__item" *ngFor="let projet of realisationsFiltrees">
    <img [src]="projet.image" [alt]="projet.title">
    <div class="galerie__overlay">
      <h3>{{ projet.title }}</h3>
      <p>{{ projet.location }}</p>
    </div>
  </div>
</section>
